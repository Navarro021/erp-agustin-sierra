<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Empresarial - Agustín de la Sierra S.A.S</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #F8F9FA; margin: 0; padding: 0; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 900px; padding: 20px; }
        
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #1A73E8; margin-top: 0; font-size: 28px; margin-bottom: 5px; }
        p.subtitle { color: #5F6368; margin-bottom: 30px; font-size: 15px; }
        
        #login-section { max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #5F6368; }
        input { width: 100%; padding: 12px; border: 1px solid #CCC; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { background: #1A73E8; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1557B0; }
        
        #menu-section { display: none; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .menu-btn { background: #fff; border: 2px solid #E8EAED; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
        .menu-btn:hover { border-color: #1A73E8; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(26,115,232,0.1); }
        .menu-btn i { font-size: 35px; margin-bottom: 10px; }
        .menu-btn h3 { color: #202124; margin: 0 0 5px 0; font-size: 16px; }
        
        /* Modulos Colores */
        .c-bot i { color: #8E24AA; } 
        .c-prod i { color: #F29900; }
        .c-vent i { color: #1E8E3E; }
        .c-mov i { color: #D93025; }
        .c-rep i { color: #1A73E8; }

        /* Panel de Alertas Inteligente */
        #alert-panel { text-align: left; margin-bottom: 25px; display: none; }
        .alerta-box { padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 10px; border-left: 5px solid; animation: fadeIn 0.5s; }
        .al-danger { background: #FCE8E6; color: #B3261E; border-color: #D93025; } /* Stock lleno < 3 cajas */
        .al-warning { background: #FEF7E0; color: #B06000; border-color: #F29900; } /* Stock vacias < 5 cajas */
        .al-info { background: #E8F0FE; color: #174EA6; border-color: #1A73E8; }    /* Bache > 120 botellas */
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h1>Agustín de la Sierra S.A.S</h1>
        <p class="subtitle">Portal de Gestión Empresarial ERP</p>

        <div id="login-section">
            <div class="form-group"><label>Usuario</label><input type="text" id="user"></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="pass"></div>
            <button onclick="verificarAcceso()">Iniciar Sesión</button>
        </div>

        <div id="menu-section">
            
            <!-- PANEL DE ALERTAS PREDICTIVO -->
            <div id="alert-panel">
                <h3 style="margin-top: 0; font-size: 16px; color: #5F6368;"><i class="fa-solid fa-bell"></i> Notificaciones del Sistema</h3>
                <div id="alertas-container">
                    <div style="color: #1A73E8; font-size: 13px;"><i class="fa-solid fa-spinner fa-spin"></i> Escaneando inventario y existencias...</div>
                </div>
            </div>

            <div class="menu-grid">
                <a href="botellas.html" class="menu-btn c-bot">
                    <i class="fa-solid fa-wine-bottle"></i><h3>Logística Botellas</h3>
                </a>
                <a href="produccion.html" class="menu-btn c-prod">
                    <i class="fa-solid fa-industry"></i><h3>Producción</h3>
                </a>
                <a href="ventas.html" class="menu-btn c-vent">
                    <i class="fa-solid fa-cash-register"></i><h3>Ventas</h3>
                </a>
                <a href="movimientos.html" class="menu-btn c-mov">
                    <i class="fa-solid fa-wallet"></i><h3>Movimientos</h3>
                </a>
                <a href="reportes.html" class="menu-btn c-rep">
                    <i class="fa-solid fa-chart-pie"></i><h3>Reportes</h3>
                </a>
            </div>
            
            <button onclick="cerrarSesion()" style="background: transparent; color: #D93025; width: auto; margin-top: 30px;">Cerrar Sesión</button>
        </div>
    </div>
</div>

<script>
    // NUEVA URL IMPLEMENTADA DIRECTAMENTE AQUÍ
    const CONFIG = { scriptUrl: 'https://script.google.com/macros/s/AKfycby-IrI3W6HDggRLF_4c9pqE8Qf3t5EclQZXH8pOi3a6y8kELMrmumSzCOkrcKUFjpxu8Q/exec' };

    window.onload = function() {
        if(sessionStorage.getItem("accesoAgustin") === "concedido") mostrarMenuYAlertas();
    }

    function verificarAcceso() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === "familia" && p === "Sierra2026") {
            sessionStorage.setItem("accesoAgustin", "concedido");
            mostrarMenuYAlertas();
        } else alert("Datos incorrectos");
    }

    function mostrarMenuYAlertas() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('menu-section').style.display = 'block';
        document.getElementById('alert-panel').style.display = 'block';
        cargarAlertasLogistica();
    }

    function cerrarSesion() { sessionStorage.removeItem("accesoAgustin"); location.reload(); }

    const normalizeString = (str) => typeof str === 'string' ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : '';

    const getVal = (row, key) => {
        const normKey = normalizeString(key);
        const foundKey = Object.keys(row).find(k => normalizeString(k) === normKey);
        return foundKey ? row[foundKey] : '';
    };

    async function cargarAlertasLogistica() {
        try {
            const res = await fetch(CONFIG.scriptUrl + '?t=' + new Date().getTime());
            const db = await res.json();
            
            let htmlAlertas = '';
            let conteoAlertas = 0;

            // 1. INVENTARIO MATEMÁTICO (Clon del SUMIFS) PARA BOTELLAS VACÍAS GLOBALES
            let vacias = { '750ml': { fab: 0, pv: 0 }, '330ml': { fab: 0, pv: 0 } };
            
            (db.BotellasVacias || []).forEach(row => {
                let tipo = normalizeString(getVal(row, 'Movimiento') || getVal(row, 'Entrada/Salida'));
                let tamanoStr = String(getVal(row, 'Tamaño') || getVal(row, 'Tamano')).toLowerCase();
                let cant = parseInt(getVal(row, 'Cantidad')) || 0;
                let bodega = normalizeString(getVal(row, 'Bodega') || getVal(row, 'Origen'));
                
                let tam = '';
                if(tamanoStr.includes('750')) tam = '750ml';
                if(tamanoStr.includes('330')) tam = '330ml';
                if(!tam) return;
                
                // PV
                if(tipo.includes('entrada') && bodega === 'punto venta') vacias[tam].pv += cant;
                if(tipo.includes('salida') && bodega === 'fabrica a punto venta') vacias[tam].pv += cant;
                if(tipo.includes('salida') && bodega === 'punto venta') vacias[tam].pv -= cant;
                if(tipo.includes('salida') && bodega === 'punto venta a fabrica') vacias[tam].pv -= cant;

                // FÁBRICA
                if(tipo.includes('entrada') && bodega === 'fabrica') vacias[tam].fab += cant;
                if(tipo.includes('salida') && bodega === 'punto venta a fabrica') vacias[tam].fab += cant;
                if(tipo.includes('salida') && bodega === 'fabrica') vacias[tam].fab -= cant;
                if(tipo.includes('salida') && bodega === 'fabrica a punto venta') vacias[tam].fab -= cant;
            });

            (db.Produccion || []).forEach(row => {
                let tamanoStr = String(getVal(row, 'Tamaño') || getVal(row, 'Tamano')).toLowerCase();
                let cant = parseInt(getVal(row, 'Cantidad')) || 0;
                let tam = '';
                if(tamanoStr.includes('750')) tam = '750ml';
                if(tamanoStr.includes('330')) tam = '330ml';
                if(tam && vacias[tam]) vacias[tam].fab -= cant;
            });

            // Sumatoria Global por tamaño
            let global750 = vacias['750ml'].fab + vacias['750ml'].pv;
            let global330 = vacias['330ml'].fab + vacias['330ml'].pv;

            // ALERTA 1: Botellas vacías (< 5 cajas = 60 botellas)
            if(global750 < 60) {
                let totalCajas = (global750 / 12).toFixed(1);
                htmlAlertas += `<div class="alerta-box al-warning"><i class="fa-solid fa-triangle-exclamation"></i> Vacías 750ml: Quedan ${global750} unidades (Aprox. ${totalCajas} cajas en total). ¡Alerta de desabastecimiento!</div>`;
                conteoAlertas++;
            }
            if(global330 < 60) {
                let totalCajas = (global330 / 12).toFixed(1);
                htmlAlertas += `<div class="alerta-box al-warning"><i class="fa-solid fa-triangle-exclamation"></i> Vacías 330ml: Quedan ${global330} unidades (Aprox. ${totalCajas} cajas en total). ¡Alerta de desabastecimiento!</div>`;
                conteoAlertas++;
            }

            // 2. INVENTARIO LLENO Y BACHES
            let invLleno = {}; 
            let prodPorBache = {};
            
            (db.Produccion || []).forEach(p => {
                let bache = getVal(p, 'Bache');
                if(!bache) return;
                // Capitalizar primera letra para estética visual
                bache = String(bache).charAt(0).toUpperCase() + String(bache).slice(1).toLowerCase();
                let cant = parseInt(getVal(p, 'Cantidad')) || 0;
                
                if(!invLleno[bache]) invLleno[bache] = 0;
                if(!prodPorBache[bache]) prodPorBache[bache] = 0;
                
                invLleno[bache] += cant;
                prodPorBache[bache] += cant;
            });

            (db.Ventas || []).forEach(v => {
                let bache = getVal(v, 'Bache');
                if(!bache) return;
                bache = String(bache).charAt(0).toUpperCase() + String(bache).slice(1).toLowerCase();
                let cant = parseInt(getVal(v, 'Cantidad')) || 0;
                
                if(invLleno[bache] !== undefined) invLleno[bache] -= cant;
            });

            // ALERTA 2: Sabores con < 3 Cajas (< 36 botellas) INCLUYENDO LOS DE 0
            Object.keys(invLleno).forEach(bache => {
                if(invLleno[bache] >= 0 && invLleno[bache] < 36) {
                    let totalCajas = (invLleno[bache] / 12).toFixed(1);
                    htmlAlertas += `<div class="alerta-box al-danger"><i class="fa-solid fa-boxes-stacked"></i> Sabor ${bache}: Quedan ${invLleno[bache]} unidades (${totalCajas} cajas). ¡Poco inventario para venta!</div>`;
                    conteoAlertas++;
                }
            });

            // ALERTA 3: Bache acercándose al fin de ciclo (>= 120 botellas)
            Object.keys(prodPorBache).forEach(bache => {
                if(prodPorBache[bache] >= 120) {
                    htmlAlertas += `<div class="alerta-box al-info"><i class="fa-solid fa-circle-info"></i> El bache "${bache}" ya produjo ${prodPorBache[bache]} botellas. Prepárense para sustituirlo pronto.</div>`;
                    conteoAlertas++;
                }
            });

            if(conteoAlertas === 0) {
                htmlAlertas = `<div style="color: #1E8E3E; font-size: 14px; font-weight: bold;"><i class="fa-solid fa-check"></i> Todo en orden. El inventario está saludable.</div>`;
            }

            document.getElementById('alertas-container').innerHTML = htmlAlertas;

        } catch(e) {
            console.log(e);
            document.getElementById('alertas-container').innerHTML = `<div style="color: #D93025;"><i class="fa-solid fa-xmark"></i> Error conectando con la base de datos para leer alertas. Verifica tu conexión a internet.</div>`;
        }
    }
</script>
</body>
</html>
