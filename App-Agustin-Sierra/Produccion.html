<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción - Agustín de la Sierra</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #F8F9FA; margin: 0; padding: 0; color: #333; }
        .wrapper { max-width: 1000px; margin: auto; padding: 20px;}
        .global-nav { background: #1A73E8; padding: 12px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .nav-logo { color: white; text-decoration: none; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .nav-items { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-items a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 4px; transition: 0.3s; }
        .nav-items a:hover { background: rgba(255,255,255,0.2); color: white; }
        .nav-items a.btn-logout { background: #D93025; color: white; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { color: #1A73E8; margin-top: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #E8EAED; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; color: #5F6368; font-size: 14px;}
        input, select { width: 100%; padding: 10px; border: 1px solid #CCC; border-radius: 4px; box-sizing: border-box; font-size: 14px; outline: none; background: white; }
        input:focus, select:focus { border-color: #1A73E8; }
        input[readonly] { background-color: #E8EAED; color: #5F6368; cursor: not-allowed; }
        button[type="submit"] { background: #1E8E3E; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; width: 100%; transition: 0.3s; }
        button[type="submit"]:hover { filter: brightness(0.9); }
        button[type="submit"]:disabled { background: #9AA0A6; cursor: not-allowed; }
        .alert { padding: 15px; margin-top: 20px; border-radius: 4px; display: none; font-weight: 500; font-size: 14px; }
        .alert.success { background: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; }
        .alert.error { background: #F8D7DA; color: #721C24; border: 1px solid #F5C6CB; }
        .table-responsive { overflow-x: auto; max-height: 400px; border: 1px solid #E8EAED; border-radius: 4px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #E8EAED; white-space: nowrap; }
        th { background-color: #F8F9FA; color: #5F6368; font-weight: 600; position: sticky; top: 0; z-index: 1;}
        tr:hover { background-color: #F1F3F4; }
        .btn-action { background: transparent; border: none; cursor: pointer; font-size: 15px; margin: 0 5px; transition: 0.2s;}
        .btn-action:hover { transform: scale(1.2); }
        .btn-edit { color: #F29900; }
        .btn-delete { color: #D93025; }
        .btn-refresh { background: transparent; color: #1A73E8; border: 1px solid #1A73E8; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .btn-refresh:hover { background: #1A73E8; color: white; }
    </style>
</head>
<body>

<nav class="global-nav">
    <div class="nav-container">
        <a href="index.html" class="nav-logo"><i class="fa-solid fa-house"></i> Menú Principal</a>
        <div class="nav-items">
            <a href="botellas.html"><i class="fa-solid fa-wine-bottle"></i> Botellas</a>
            <a href="produccion.html"><i class="fa-solid fa-industry"></i> Producción</a>
            <a href="ventas.html"><i class="fa-solid fa-cash-register"></i> Ventas</a>
            <a href="movimientos.html"><i class="fa-solid fa-wallet"></i> Movimientos</a>
            <a href="reportes.html"><i class="fa-solid fa-chart-pie"></i> Reportes</a>
            <a href="#" onclick="cerrarSesionGlobal()" class="btn-logout"><i class="fa-solid fa-power-off"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="wrapper">
    <div class="card">
        <h2 id="formTitle"><i class="fa-solid fa-flask"></i> Registrar Producción (Bache)</h2>
        <form id="crudForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label>Código de Bache</label>
                    <select id="codigo" required>
                        <option value="">Cargando códigos...</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Sabor / Fruta</label>
                    <input type="text" id="bache" placeholder="Se asigna automáticamente" readonly required>
                </div>
                <div class="form-group">
                    <label>Tamaño de Botella</label>
                    <select id="tamano" required>
                        <option value="">Seleccione...</option>
                        <option value="750ml">750ml</option>
                        <option value="330ml">330ml</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Cantidad Producida (Botellas)</label>
                <input type="number" id="cantidad" required>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="submit" id="submitBtn"><i class="fa-solid fa-floppy-disk"></i> Registrar Producción</button>
                <button type="button" id="cancelBtn" style="display:none; background:#5F6368; color:white; border:none; padding:12px 20px; border-radius:4px; cursor:pointer; font-weight:bold; margin-top:10px;" onclick="cancelarEdicion()"><i class="fa-solid fa-times"></i> Cancelar</button>
            </div>
        </form>
        <div id="statusMessage" class="alert"></div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0; border: none; padding: 0;"><i class="fa-solid fa-list-ul"></i> Historial de Producción</h2>
            <button class="btn-refresh" onclick="loadData()"><i class="fa-solid fa-arrows-rotate"></i> Refrescar</button>
        </div>
        <div class="table-responsive">
            <table id="dataTable">
                <thead><tr><th>Fecha</th><th>Código</th><th>Bache</th><th>Cant.</th><th>Tamaño</th><th style="text-align:center;">Acciones</th></tr></thead>
                <tbody id="tableBody">
                    <!-- El mensaje de carga inicial -->
                    <tr><td colspan="6" style="text-align:center; padding: 20px; color: #1A73E8;"><i class="fa-solid fa-spinner fa-spin fa-lg"></i> Sincronizando con la base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function cerrarSesionGlobal() { sessionStorage.removeItem("accesoAgustin"); window.location.href = "index.html"; }
    
    // URL MAESTRA
    const CONFIG = { scriptUrl: 'https://script.google.com/macros/s/AKfycby-IrI3W6HDggRLF_4c9pqE8Qf3t5EclQZXH8pOi3a6y8kELMrmumSzCOkrcKUFjpxu8Q/exec' };
    
    let modoEdicion = false;
    let filaEnEdicion = null;
    let baseData = [];
    let mapaCodigos = {}; 

    const normalizeString = (str) => typeof str === 'string' ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : '';

    const getVal = (row, key) => {
        const normKey = normalizeString(key);
        const foundKey = Object.keys(row).find(k => normalizeString(k) === normKey);
        return foundKey ? row[foundKey] : '';
    };

    function parseCustomDate(dateStr) {
        if (!dateStr) return 0;
        let str = String(dateStr).trim();
        if (str.match(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/)) {
            let parts = str.split('/');
            let y = parseInt(parts[2], 10); if (y < 100) y += 2000;
            return new Date(y, parseInt(parts[1], 10)-1, parseInt(parts[0], 10)).getTime();
        }
        let d = new Date(str);
        if (!isNaN(d.getTime())) return d.getTime(); return 0;
    }

    async function loadData() {
        // MEJORA UX: Feedback visual inmediato de que se está actualizando
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px; color: #1A73E8;"><i class="fa-solid fa-spinner fa-spin fa-lg"></i> <strong>Sincronizando con la base de datos...</strong></td></tr>';

        try {
            const res = await fetch(CONFIG.scriptUrl + '?t=' + new Date().getTime());
            const db = await res.json();
            
            // 1. CARGAR CÓDIGOS ACTIVOS (Dashboard) EN EL SELECT
            let dashboardData = db.Dashboard || [];
            let selectHtml = '<option value="">Seleccione un Código...</option>';
            mapaCodigos = {}; 
            
            if (dashboardData.length > 0) {
                dashboardData.forEach(row => {
                    const cod = getVal(row, 'Codigo');
                    const bache = getVal(row, 'Bache');
                    const estado = getVal(row, 'Estado'); 
                    
                    if(cod && String(estado).trim() === "1") {
                        mapaCodigos[cod] = bache;
                        selectHtml += `<option value="${cod}">${cod} - ${bache}</option>`;
                    }
                });
            }
            document.getElementById('codigo').innerHTML = selectHtml;

            // 2. CARGAR LA GRILLA DE PRODUCCIÓN
            baseData = db.Produccion || [];
            let dataFiltrada = baseData.filter(row => getVal(row, 'Fecha') !== '');
            dataFiltrada.sort((a, b) => {
                let diff = parseCustomDate(getVal(b, 'Fecha')) - parseCustomDate(getVal(a, 'Fecha'));
                return diff === 0 ? b._rowNumber - a._rowNumber : diff;
            });

            let html = '';
            if(dataFiltrada.length === 0) html = '<tr><td colspan="6" style="text-align:center;">Sin registros</td></tr>';
            else {
                dataFiltrada.forEach(row => {
                    let rowEncoded = encodeURIComponent(JSON.stringify(row));
                    html += `<tr>
                        <td>${getVal(row, 'Fecha')}</td>
                        <td style="font-weight:bold; color:#1A73E8;">${getVal(row, 'Codigo')}</td>
                        <td>${getVal(row, 'Bache')}</td>
                        <td>${getVal(row, 'Cantidad')}</td>
                        <td>${getVal(row, 'Tamaño') || getVal(row, 'Tamano')}</td>
                        <td style="text-align:center;">
                            <button class="btn-action btn-edit" onclick="editarRegistro('${rowEncoded}')" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-action btn-delete" onclick="eliminarRegistro(${row._rowNumber})" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            }
            document.getElementById('tableBody').innerHTML = html;
        } catch (e) { 
            console.log(e);
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding: 20px;"><i class="fa-solid fa-triangle-exclamation"></i> Fallo la conexión con la base de datos.</td></tr>`; 
        }
    }

    // ==========================================
    // LÓGICA: AUTOCOMPLETAR SABOR AL CAMBIAR CÓDIGO
    // ==========================================
    document.getElementById('codigo').addEventListener('change', function(e) {
        const codSeleccionado = e.target.value;
        const campoSabor = document.getElementById('bache');
        
        if (codSeleccionado && mapaCodigos[codSeleccionado]) {
            campoSabor.value = mapaCodigos[codSeleccionado];
        } else {
            campoSabor.value = "";
        }
    });

    // ==========================================
    // LÓGICA: EDITAR Y ELIMINAR (CRUD)
    // ==========================================
    function editarRegistro(rowStr) {
        if(!confirm("¿Está seguro que desea EDITAR este registro de producción?")) return;
        
        const row = JSON.parse(decodeURIComponent(rowStr));
        modoEdicion = true; 
        filaEnEdicion = row._rowNumber;
        
        // 1. Asignar Fecha
        let fechaStr = getVal(row, 'Fecha');
        if(fechaStr) {
            let parts = fechaStr.split('/');
            document.getElementById('fecha').value = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
        
        // 2. Asignar Código y Sabor
        const codOriginal = getVal(row, 'Codigo');
        const saborOriginal = getVal(row, 'Bache');
        const selectCodigo = document.getElementById('codigo');
        
        let optionExists = Array.from(selectCodigo.options).some(opt => opt.value === String(codOriginal));
        if (!optionExists && codOriginal) {
            let newOption = new Option(`${codOriginal} - ${saborOriginal} (Histórico)`, codOriginal);
            selectCodigo.add(newOption);
            mapaCodigos[codOriginal] = saborOriginal; 
        }
        
        selectCodigo.value = codOriginal;
        document.getElementById('bache').value = saborOriginal;
        
        // 3. Asignar Tamaño y Cantidad
        let tamStr = getVal(row, 'Tamaño') || getVal(row, 'Tamano');
        document.getElementById('tamano').value = String(tamStr).toLowerCase().includes('750') ? '750ml' : '330ml';
        document.getElementById('cantidad').value = getVal(row, 'Cantidad');

        // 4. Cambiar UI a modo edición
        document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editando Producción (Fila ' + filaEnEdicion + ')';
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fa-solid fa-save"></i> Guardar Cambios';
        btn.style.background = '#F29900';
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
        modoEdicion = false; 
        filaEnEdicion = null; 
        document.getElementById('crudForm').reset();
        document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-flask"></i> Registrar Producción (Bache)';
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Registrar Producción';
        btn.style.background = '#1E8E3E';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function eliminarRegistro(rowNumber) {
        if(!confirm("⚠️ ¿Está seguro que desea ELIMINAR permanentemente este registro de producción de la base de datos?")) return;
        try {
            let req = await fetch(CONFIG.scriptUrl, { method: 'POST', body: JSON.stringify({ sheetName: "produccion", action: "delete", rowNumber: rowNumber }) });
            let res = await req.json();
            if(res.status !== 'Success') throw new Error(res.message);
            alert("Registro eliminado exitosamente.");
            loadData();
        } catch(e) { 
            alert("Error al eliminar."); 
        }
    }

    // ==========================================
    // ENVÍO DE DATOS
    // ==========================================
    document.getElementById('crudForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const rawDate = document.getElementById('fecha').value;
        const [y, m, d] = rawDate.split('-');
        let formattedDate = `${d}/${m}/${y}`;
        
        // Extracción directa del número del mes
        const mesNumero = parseInt(m, 10); 

        // Columnas BD Produccion: Fecha | Codigo | Bache | Cantidad | Tamaño | Mes | Año | Estado
        const rowData = [
            formattedDate, 
            document.getElementById('codigo').value, 
            document.getElementById('bache').value, 
            document.getElementById('cantidad').value, 
            document.getElementById('tamano').value, 
            mesNumero, 
            y, 
            "1"
        ];
        
        const btn = document.getElementById('submitBtn'); 
        const status = document.getElementById('statusMessage');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...'; 
        btn.disabled = true; 
        status.style.display = 'none';

        try {
            let actionStr = modoEdicion ? "update" : "append";
            let payload = { sheetName: "produccion", action: actionStr, rowData: rowData };
            if (modoEdicion) payload.rowNumber = filaEnEdicion;

            let req = await fetch(CONFIG.scriptUrl, { method: 'POST', body: JSON.stringify(payload) });
            let res = await req.json();
            
            if(res.status === 'Success') {
                status.className = 'alert success'; 
                status.style.display = 'block'; 
                status.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${modoEdicion ? 'Cambios guardados' : 'Producción registrada'} exitosamente.`;
                cancelarEdicion(); 
                setTimeout(() => loadData(), 1500);
            } else {
                throw new Error(res.message);
            }
        } catch(error) { 
            status.className = 'alert error'; 
            status.style.display = 'block'; 
            status.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Error al comunicarse con la base de datos.';
        } finally {
            btn.innerHTML = modoEdicion ? '<i class="fa-solid fa-save"></i> Guardar Cambios' : '<i class="fa-solid fa-floppy-disk"></i> Registrar Producción';
            btn.disabled = false;
        }
    });

    window.onload = loadData;
</script>
</body>
</html>
